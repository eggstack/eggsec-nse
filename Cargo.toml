[package]
name = "eggsec-nse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eggstack/eggsec-nse"
rust-version = "1.89"
description = "Standalone Lua-based Nmap Scripting Engine runtime"
authors = ["David Bowman"]
homepage = "https://github.com/eggstack/eggsec-nse"
documentation = "https://docs.rs/eggsec-nse"
readme = "README.md"
keywords = ["nse", "nmap", "lua", "scripting-engine"]
categories = ["development-tools"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase E WS3: Lua sync closures block_on a current-thread/multi-thread runtime;
# net/io/sync/time for socket/dns helpers. No fs/process/signal/io-std.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
parking_lot = "0.12"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", features = ["std_rng"] }
regex = "1"
base64 = "0.23"
flate2 = "1"
url = "2"
urlencoding = "2.1"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
hostname = "0.4"
dashmap = "6"
rustc-hash = "2"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13", features = ["json", "blocking", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
native-tls = { version = "0.2.18", optional = true }
scraper = "0.21"
mlua = { version = "0.11.6", features = ["async"], optional = true }
mlua-luau-scheduler = { version = "0.2", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
des = { version = "0.8", optional = true }
ssh2 = { version = "0.9", optional = true }
ipnetwork = { version = "0.21", features = ["serde"] }
# Runtime-extraction Milestone 002: zero `eggsec-*` dependencies. Eggsec
# report conversion lives in `eggsec::nse_bridge` and the scoped-transport
# HTTP adapter in `eggsec::nse_http_capability`; the runtime uses only
# public-ecosystem and std types for NSE semantics.

[dev-dependencies]
toml = "0.8"

[[test]]
name = "ssh_runtime_tests"
required-features = ["nse-ssh2"]

[features]
default = []
nse = ["mlua", "mlua-luau-scheduler", "openssl", "des", "dep:native-tls"]
nse-ssh2 = ["nse", "dep:ssh2"]
sandbox = []
stress-testing = []
