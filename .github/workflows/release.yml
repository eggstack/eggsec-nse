name: Release

# Future-release publisher. Runs ONLY on version tags; ordinary pushes and
# pull requests can never publish. The crates.io side must have a matching
# Trusted Publisher entry for this repository + workflow + environment
# (crate settings on crates.io; see docs/RELEASING.md). Until that
# website-side configuration exists, this workflow fails closed at the
# authentication step and releases use the documented manual-token path.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v${version}" = "${tag}" || {
            echo "tag ${tag} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          test -z "$(git status --porcelain)" || {
            echo "working tree is not clean" >&2
            exit 1
          }
      - run: cargo fmt --all --check
      - name: Install ripgrep (required by scripts/check-boundaries.sh)
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ripgrep
            else
              echo "ripgrep (rg) is required by scripts/check-boundaries.sh and no supported installer was found" >&2
              exit 1
            fi
          fi
          rg --version
      - run: ./scripts/check-boundaries.sh
      - run: cargo metadata --no-deps
      - run: cargo check --no-default-features
      - run: cargo check --features nse
      - run: cargo test --features nse
      - run: cargo check --features nse-ssh2
      - run: cargo check --features nse,sandbox
      - run: cargo package
      - uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
